# Her "main" güncellemesinde: testleri çalıştır, sw.js'i yeniden üret, oyunu GitHub Pages'e yayınla.
name: Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayin:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Testler
        run: node tests/run.js
      - name: Servis işçisi (çevrimdışı liste ve sürüm)
        run: node tools/build-sw.mjs
      - name: Yayın klasörü
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
